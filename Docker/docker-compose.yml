services:
  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile

    image: prodml-api:0.1.0 #  # Names the image generated by the build


    ports:
      - "8000:8000"

    environment:
      PRODML_MODEL_PATH: /app/models/model.pkl
      PRODML_LOG_LEVEL: INFO

    volumes:
      - ../models:/app/models:ro

    restart: unless-stopped
